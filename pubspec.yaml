name: nornapp
description: "NornApp - tu calendario familiar inteligente."
publish_to: 'none'
version: 1.0.0

environment:
  # google_mobile_ads 8+ exige Dart 3.10 / Flutter 3.38.1
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Localización (español + semana que empieza en lunes en los calendarios)
  flutter_localizations:
    sdk: flutter
  intl: any

  # Firebase
  firebase_core:        ^4.0.0
  firebase_auth:        ^6.1.4
  firebase_messaging:   ^16.1.1
  cloud_firestore:      ^6.0.0
  # google_sign_in eliminado: no se usa y, si ofreces login con Google en iOS,
  # Apple exige añadir también "Iniciar sesión con Apple" (guía 4.8).

  # Notificaciones locales + zonas horarias
  flutter_local_notifications: ^18.0.0
  timezone:             ^0.9.4

  # Almacenamiento local
  sqflite:              ^2.0.0+4
  sqflite_common_ffi:   ^2.3.7+1
  path_provider:        ^2.0.0+1
  path:                 ^1.8.0
  shared_preferences:   ^2.0.15
  # v9+ incluye el Privacy Manifest de iOS que exige Apple
  flutter_secure_storage: ^9.2.4

  # Calendario
  table_calendar:       ^3.0.9

  # QR
  qr_flutter:      ^4.1.0
  mobile_scanner:  ^6.0.0
  # Selección de imágenes (foto de perfil / adjuntos)
  image_picker:    ^1.1.2
  # Monetización
  google_mobile_ads:          ^9.0.0   # AdMob + consentimiento UMP
  app_tracking_transparency:  ^2.0.6   # aviso ATT de iOS
  in_app_purchase:            ^3.2.0   # suscripción Premium
  url_launcher:               ^6.3.0   # enlaces legales / gestionar suscripción

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:          ^5.0.0
  flutter_native_splash:  ^2.4.3
  flutter_launcher_icons: ^0.14.0

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android_gravity: center
  android_12:
    image: assets/images/logo.png
    icon_background_color: "#FFFFFF"
  ios: true
  android: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Icono.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Icono.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/LogoGrande.png