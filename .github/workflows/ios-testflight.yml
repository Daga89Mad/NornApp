# Compila NornApp para iOS y la sube a TestFlight (App Store Connect).
# Mismo sistema que WarZero.
#
# Cuándo se ejecuta:
#   - En cada push a main (a la vez que la APK, ver build-apk.yml).
#   - A mano: pestaña Actions > "iOS TestFlight" > Run workflow.
#
# Firma: certificado "Apple Distribution" propio (.p12 en un secret) importado
# en un llavero temporal del runner, más la clave de la API de App Store
# Connect para que Xcode cree/descargue los perfiles de aprovisionamiento.
# No se usa el "cloud signing" (certificado gestionado por Apple): firma mal
# los frameworks embebidos (Firebase, plugins, App.framework de Flutter) y
# App Store Connect rechaza la subida con "Invalid Signature".
#
# Secrets necesarios (Settings > Secrets and variables > Actions > Secrets):
#   APPLE_TEAM_ID                     -> Team ID de 10 caracteres (developer.apple.com > Membership)
#   APP_STORE_CONNECT_KEY_ID          -> Key ID de la clave de API
#   APP_STORE_CONNECT_ISSUER_ID       -> Issuer ID (App Store Connect > Users and Access > Integrations)
#   APP_STORE_CONNECT_KEY_BASE64      -> el fichero AuthKey_XXXX.p8 en base64 (base64 -w0 AuthKey_XXXX.p8)
#   IOS_DIST_CERT_P12_BASE64          -> certificado Apple Distribution + clave privada (.p12) en base64
#   IOS_DIST_CERT_PASSWORD            -> contraseña del .p12
#   La clave de API debe tener rol "Admin" para poder crear perfiles.
#
# Variable opcional (Settings > Secrets and variables > Actions > Variables):
#   IOS_BUILD_NUMBER_OFFSET -> se suma a github.run_number. Úsala si ya subiste
#   builds a mano con números más altos (App Store Connect rechaza un número de
#   build repetido o menor para la misma versión).
#
# Requisito previo en App Store Connect: la app tiene que existir (My Apps > +)
# con el mismo bundle id que el proyecto Xcode: com.YeahSoft.NornApp
# (el mismo que tiene la app iOS en Firebase / GoogleService-Info.plist).

name: iOS TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60

    env:
      ARCHIVE_PATH: ${{ github.workspace }}/build/ios/archive/Runner.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/ios/export

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Comprobar secrets
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          FALTAN=""
          [ -z "$TEAM_ID" ]    && FALTAN="$FALTAN APPLE_TEAM_ID"
          [ -z "$KEY_ID" ]     && FALTAN="$FALTAN APP_STORE_CONNECT_KEY_ID"
          [ -z "$ISSUER_ID" ]  && FALTAN="$FALTAN APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$KEY_BASE64" ] && FALTAN="$FALTAN APP_STORE_CONNECT_KEY_BASE64"
          [ -z "$P12_BASE64" ] && FALTAN="$FALTAN IOS_DIST_CERT_P12_BASE64"
          [ -z "$P12_PASSWORD" ] && FALTAN="$FALTAN IOS_DIST_CERT_PASSWORD"
          if [ -n "$FALTAN" ]; then
            echo "::error title=Faltan secrets de Apple::No están configurados:$FALTAN"
            exit 1
          fi

      - name: Comprobar bundle id
        run: |
          BUNDLE_ID=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER = ' ios/Runner.xcodeproj/project.pbxproj \
            | grep -v RunnerTests | sed -E 's/.*= ([^;]+);/\1/')
          echo "Bundle id: $BUNDLE_ID"
          case "$BUNDLE_ID" in
            com.example.*)
              echo "::error title=Bundle id no válido para App Store::'$BUNDLE_ID' usa el prefijo com.example, que Apple no deja registrar. Cámbialo en Xcode (y en Firebase) antes de subir a TestFlight."
              exit 1 ;;
          esac

      - name: Xcode (última estable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versiones
        run: |
          flutter --version
          xcodebuild -version

      - name: Número de build
        id: build
        run: |
          OFFSET="${{ vars.IOS_BUILD_NUMBER_OFFSET }}"
          [ -z "$OFFSET" ] && OFFSET=0
          NUMBER=$(( ${{ github.run_number }} + OFFSET ))
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión $VERSION, build $NUMBER"

      - name: Clave de la API de App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$KEY_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_$KEY_ID.p8"
          echo "ASC_KEY_PATH=$KEY_DIR/AuthKey_$KEY_ID.p8" >> "$GITHUB_ENV"

      - name: Certificado de distribución (llavero temporal)
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/nornapp-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if ! security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"; then
            echo "::error title=No se pudo importar el .p12::Revisa IOS_DIST_CERT_P12_BASE64 e IOS_DIST_CERT_PASSWORD (el .p12 debe exportarse con -keypbe/-certpbe PBE-SHA1-3DES y -macalg sha1)."
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # El llavero temporal primero en la lista de búsqueda.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

          IDENTIDADES=$(security find-identity -v -p codesigning "$KEYCHAIN")
          echo "$IDENTIDADES"
          if ! echo "$IDENTIDADES" | grep -q "Apple Distribution"; then
            echo "::error title=Certificado incorrecto::El .p12 no contiene una identidad 'Apple Distribution' con su clave privada."
            exit 1
          fi
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Dependencias
        run: flutter pub get

      # Prepara el proyecto (Generated.xcconfig con versión y build, pods,
      # código Dart compilado) sin firmar; la firma la hace xcodebuild después.
      - name: Compilar Flutter (sin firma)
        run: |
          set -o pipefail
          if ! flutter build ios --release --no-codesign \
                --build-number=${{ steps.build.outputs.number }} 2>&1 | tee flutter-build.log; then
            RESUMEN=$(grep -n -i -E "error|exception|failed|^lib/" flutter-build.log | grep -v -i warning | head -60)
            [ -z "$RESUMEN" ] && RESUMEN=$(tail -60 flutter-build.log)
            RESUMEN="${RESUMEN//'%'/'%25'}"
            RESUMEN="${RESUMEN//$'\n'/'%0A'}"
            echo "::error title=Fallo al compilar Flutter iOS::${RESUMEN}"
            exit 1
          fi

      # Firma MANUAL solo del target Runner con el certificado del .p12 y un
      # perfil App Store descargado (o creado) con la clave de API.
      #
      # Por qué no firma automática: con ella el archivado firma con "Apple
      # Development" y, como cada runner es nuevo, Xcode crea un certificado de
      # desarrollo en la cuenta en CADA build hasta agotar el cupo de Apple
      # ("Your account has reached the maximum number of certificates").
      # Por qué no CODE_SIGN_IDENTITY en la línea de comandos: se aplica a todos
      # los targets, también a los paquetes SPM de Firebase, que van con firma
      # automática y fallan con "conflicting provisioning settings".
      # ios/Flutter/Release.xcconfig solo lo usa el target Runner, así que los
      # ajustes se añaden ahí (solo en el runner, no se commitea).
      - name: Perfil App Store y firma manual del Runner
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -e
          BUNDLE_ID=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER = ' ios/Runner.xcodeproj/project.pbxproj \
            | grep -v RunnerTests | sed -E 's/.*= ([^;]+);/\1/')
          command -v fastlane >/dev/null || brew install fastlane

          python3 - "$KEY_ID" "$ISSUER_ID" "$ASC_KEY_PATH" "$RUNNER_TEMP/asc_api_key.json" <<'EOF'
          import json, sys
          key_id, issuer, key_path, out = sys.argv[1:]
          json.dump({"key_id": key_id, "issuer_id": issuer,
                     "key": open(key_path).read(), "in_house": False}, open(out, "w"))
          EOF

          if ! fastlane sigh \
                --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
                --app_identifier "$BUNDLE_ID" \
                --team_id "$TEAM_ID" \
                --provisioning_name "NornApp AppStore CI" \
                --output_path "$RUNNER_TEMP" \
                --filename nornapp_appstore.mobileprovision; then
            echo "::error title=No se pudo obtener el perfil App Store::fastlane sigh falló (revisa que la clave de API tenga rol Admin y que el certificado Apple Distribution del .p12 siga vigente en developer.apple.com)."
            exit 1
          fi

          PROFILE="$RUNNER_TEMP/nornapp_appstore.mobileprovision"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE" "$DIR/$PROFILE_UUID.mobileprovision"
          done
          echo "Perfil: $PROFILE_NAME ($PROFILE_UUID) para $BUNDLE_ID"

          {
            echo ""
            echo "// --- Firma de CI (añadido por el workflow ios-testflight) ---"
            echo "CODE_SIGN_STYLE = Manual"
            echo "DEVELOPMENT_TEAM = $TEAM_ID"
            echo "CODE_SIGN_IDENTITY = Apple Distribution"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME"
            echo "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*] = $PROFILE_NAME"
          } >> ios/Flutter/Release.xcconfig
          cat ios/Flutter/Release.xcconfig

          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/asc_api_key.json"

      # Sin -allowProvisioningUpdates: el archivado no toca el portal de Apple,
      # así que no puede crear certificados ni perfiles por su cuenta.
      - name: Archivar
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          if ! xcodebuild archive \
                -workspace ios/Runner.xcworkspace \
                -scheme Runner \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -archivePath "$ARCHIVE_PATH" \
                DEVELOPMENT_TEAM="$TEAM_ID" 2>&1 | tee archive.log | grep -E "error:|warning: .*sign|ARCHIVE (SUCCEEDED|FAILED)"; then
            RESUMEN=$(grep -E "error:|No profiles|No signing certificate|Cloud signing" archive.log | sort -u | head -40)
            [ -z "$RESUMEN" ] && RESUMEN=$(tail -60 archive.log)
            RESUMEN="${RESUMEN//'%'/'%25'}"
            RESUMEN="${RESUMEN//$'\n'/'%0A'}"
            echo "::error title=Fallo al archivar::${RESUMEN}"
            exit 1
          fi

      # destination=upload hace que exportArchive suba directamente el .ipa a
      # App Store Connect; desde ahí pasa a TestFlight al terminar de procesarse.
      - name: Exportar y subir a TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyLists-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

          set -o pipefail
          if ! xcodebuild -exportArchive \
                -archivePath "$ARCHIVE_PATH" \
                -exportPath "$EXPORT_PATH" \
                -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
                -allowProvisioningUpdates \
                -authenticationKeyPath "$ASC_KEY_PATH" \
                -authenticationKeyID "$KEY_ID" \
                -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee export.log; then
            RESUMEN=$(grep -i -E "error|rejected|invalid|already been used|redundant" export.log | sort -u | head -40)
            [ -z "$RESUMEN" ] && RESUMEN=$(tail -60 export.log)
            RESUMEN="${RESUMEN//'%'/'%25'}"
            RESUMEN="${RESUMEN//$'\n'/'%0A'}"
            echo "::error title=Fallo al subir a App Store Connect::${RESUMEN}"
            exit 1
          fi

      - name: Resumen
        if: success()
        run: |
          {
            echo "### Subida a TestFlight correcta"
            echo ""
            echo "- Versión: ${{ steps.build.outputs.version }} (build ${{ steps.build.outputs.number }})"
            echo "- Commit: $(git rev-parse --short HEAD)"
            echo ""
            echo "App Store Connect tarda unos minutos en procesar la build antes de que aparezca en TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs de compilación
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: |
            flutter-build.log
            archive.log
            export.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Borrar la clave de API y el llavero
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/asc_api_key.json"
          [ -n "$SIGNING_KEYCHAIN" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
